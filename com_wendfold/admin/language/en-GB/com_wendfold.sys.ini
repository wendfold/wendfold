; Wendfold - Chapter Management System
; Administrator System Language File - en-GB
;
; PURPOSE OF THIS FILE:
; Joomla loads sys.ini on EVERY page load before any component boots.
; It serves three specific purposes:
;
;   1. ADMIN SIDEBAR LABELS
;      The "Wendfold" menu item and all submenu entries.
;      These must be here because the sidebar renders before the
;      component is active, so com_wendfold.ini is not yet loaded.
;
;   2. FRONT-END MENU ITEM TYPE PICKER
;      When an admin goes to Menus -> Main Menu -> Add -> Wendfold,
;      the list of available menu item types (Upcoming Events, Officer
;      Roster, Member Dashboard, etc.) is rendered during bootstrap.
;      The MENU_TITLE and MENU_DESC strings must be here.
;
;   3. INSTALLER MESSAGES
;      The component name and description shown in the Extensions
;      manager during install/update come from this file.
;
; DO NOT put regular view strings here. Put those in:
;   admin/language/en-GB/com_wendfold.ini  (admin views)
;   language/en-GB/com_wendfold.ini        (site/front-end views)
;
; ASCII characters ONLY - no Unicode, em dashes, curly quotes.

;- Component identity (Extensions manager + sidebar header) -
