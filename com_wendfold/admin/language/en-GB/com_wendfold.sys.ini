COM_WENDFOLD_XML_DESCRIPTION="Chapter management for clubs, chapters, and member organizations: members, officers, dues, events, attendance, activities, trips, volunteer staffing, and reports."
COM_WENDFOLD_BRAND_MARK_ALT="Wendfold mark"

